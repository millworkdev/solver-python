# Operator-dispatched PyPI Trusted Publishing for the exact retained 0.1.0
# candidate. This workflow never builds or repacks an artifact.
name: publish

on:
  workflow_dispatch:
    inputs:
      expected-version:
        description: "Exact retained version (must be 0.1.0)"
        required: true
        type: string
      expected-export-sha:
        description: "Full reviewed public main SHA to publish"
        required: true
        type: string
      authorization-sha256:
        description: "SHA-256 of the canonical bounded authorization payload"
        required: true
        type: string
      authorization-actor:
        description: "GitHub login that authored the durable authorization"
        required: true
        type: string
      authorization-ref:
        description: "Immutable GitHub issue or pull-request comment URL"
        required: true
        type: string
      authorization-issued-at:
        description: "Authorization issue time as UTC RFC 3339 seconds"
        required: true
        type: string
      authorization-expires-at:
        description: "Authorization expiry as UTC RFC 3339 seconds (at most 24 hours later)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  publish-and-verify:
    runs-on: ubuntu-24.04
    environment: pypi-publish
    env:
      EXPECTED_VERSION: ${{ inputs.expected-version }}
      EXPECTED_EXPORT_SHA: ${{ inputs.expected-export-sha }}
      AUTHORIZATION_SHA256: ${{ inputs.authorization-sha256 }}
      AUTHORIZATION_ACTOR: ${{ inputs.authorization-actor }}
      AUTHORIZATION_REF: ${{ inputs.authorization-ref }}
      AUTHORIZATION_ISSUED_AT: ${{ inputs.authorization-issued-at }}
      AUTHORIZATION_EXPIRES_AT: ${{ inputs.authorization-expires-at }}
      EXPECTED_ENVIRONMENT: pypi-publish
    steps:
      - name: Check out the reviewed main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Pin Node.js for preconditions
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"

      - name: Verify exact export, authority input, and definitive version absence
        run: node scripts/check-publish-preconditions.mjs

      - name: Upload the retained wheel and sdist through OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true
          skip-existing: false
          print-hash: true

      - name: Set up CPython 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Verify registry bytes and both installed artifacts on CPython 3.11
        env:
          SOLVERAPI_API_KEY: ${{ secrets.SOLVERAPI_API_KEY }}
          SOLVERAPI_BASE_URL: ${{ vars.SOLVERAPI_BASE_URL }}
        run: |
          python scripts/verify-published-release.py --artifact-kind wheel --evidence-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.11-wheel" --out evidence/python-3.11-wheel.json
          python scripts/verify-published-release.py --artifact-kind sdist --evidence-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.11-sdist" --out evidence/python-3.11-sdist.json

      - name: Set up CPython 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify registry bytes and both installed artifacts on CPython 3.12
        env:
          SOLVERAPI_API_KEY: ${{ secrets.SOLVERAPI_API_KEY }}
          SOLVERAPI_BASE_URL: ${{ vars.SOLVERAPI_BASE_URL }}
        run: |
          python scripts/verify-published-release.py --artifact-kind wheel --evidence-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.12-wheel" --out evidence/python-3.12-wheel.json
          python scripts/verify-published-release.py --artifact-kind sdist --evidence-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.12-sdist" --out evidence/python-3.12-sdist.json

      - name: Set up CPython 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Verify registry bytes and both installed artifacts on CPython 3.13
        env:
          SOLVERAPI_API_KEY: ${{ secrets.SOLVERAPI_API_KEY }}
          SOLVERAPI_BASE_URL: ${{ vars.SOLVERAPI_BASE_URL }}
        run: |
          python scripts/verify-published-release.py --artifact-kind wheel --evidence-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.13-wheel" --out evidence/python-3.13-wheel.json
          python scripts/verify-published-release.py --artifact-kind sdist --evidence-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.13-sdist" --out evidence/python-3.13-sdist.json

      - name: Set up CPython 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Verify registry bytes and both installed artifacts on CPython 3.14
        env:
          SOLVERAPI_API_KEY: ${{ secrets.SOLVERAPI_API_KEY }}
          SOLVERAPI_BASE_URL: ${{ vars.SOLVERAPI_BASE_URL }}
        run: |
          python scripts/verify-published-release.py --artifact-kind wheel --evidence-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.14-wheel" --out evidence/python-3.14-wheel.json
          python scripts/verify-published-release.py --artifact-kind sdist --evidence-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.14-sdist" --out evidence/python-3.14-sdist.json

      - name: Retain exact post-publish verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-pypi-0.1.0-verification
          path: evidence/
          retention-days: 90
          if-no-files-found: error
