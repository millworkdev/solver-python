# Credential-free re-verification of the exact released distribution.
#
# This workflow never publishes, never uploads to a registry, never enters the
# protected publishing environment, and carries no credential. It re-proves the
# facts that need none: the registry files are exactly the reviewed candidate's
# attested bytes, and each of them clean-installs and exercises its public
# surface on every supported CPython. The live Echo call is deliberately out of
# scope here, and every evidence record it writes says so.
#
# Evidence is retained on every dispatch, including one where a runtime fails,
# so a partial result is still a readable result.
name: verify-release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the reviewed main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up CPython 3.11
        if: ${{ !cancelled() }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Verify registry bytes and both installed artifacts on CPython 3.11
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # Both artifact proofs run even when the first one fails, so a
          # failing live Echo can never cost this runtime its second
          # credential-free record. The step still fails, afterwards.
          status=0
          python scripts/verify-published-release.py --artifact-kind wheel --expected-python 3.11 --provenance reverification --evidence-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.11-wheel" --out evidence/python-3.11-wheel.json || status=$?
          python scripts/verify-published-release.py --artifact-kind sdist --expected-python 3.11 --provenance reverification --evidence-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.11-sdist" --out evidence/python-3.11-sdist.json || status=$?
          exit "$status"

      - name: Set up CPython 3.12
        if: ${{ !cancelled() }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify registry bytes and both installed artifacts on CPython 3.12
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # Both artifact proofs run even when the first one fails, so a
          # failing live Echo can never cost this runtime its second
          # credential-free record. The step still fails, afterwards.
          status=0
          python scripts/verify-published-release.py --artifact-kind wheel --expected-python 3.12 --provenance reverification --evidence-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.12-wheel" --out evidence/python-3.12-wheel.json || status=$?
          python scripts/verify-published-release.py --artifact-kind sdist --expected-python 3.12 --provenance reverification --evidence-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.12-sdist" --out evidence/python-3.12-sdist.json || status=$?
          exit "$status"

      - name: Set up CPython 3.13
        if: ${{ !cancelled() }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Verify registry bytes and both installed artifacts on CPython 3.13
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # Both artifact proofs run even when the first one fails, so a
          # failing live Echo can never cost this runtime its second
          # credential-free record. The step still fails, afterwards.
          status=0
          python scripts/verify-published-release.py --artifact-kind wheel --expected-python 3.13 --provenance reverification --evidence-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.13-wheel" --out evidence/python-3.13-wheel.json || status=$?
          python scripts/verify-published-release.py --artifact-kind sdist --expected-python 3.13 --provenance reverification --evidence-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.13-sdist" --out evidence/python-3.13-sdist.json || status=$?
          exit "$status"

      - name: Set up CPython 3.14
        if: ${{ !cancelled() }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Verify registry bytes and both installed artifacts on CPython 3.14
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # Both artifact proofs run even when the first one fails, so a
          # failing live Echo can never cost this runtime its second
          # credential-free record. The step still fails, afterwards.
          status=0
          python scripts/verify-published-release.py --artifact-kind wheel --expected-python 3.14 --provenance reverification --evidence-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.14-wheel" --out evidence/python-3.14-wheel.json || status=$?
          python scripts/verify-published-release.py --artifact-kind sdist --expected-python 3.14 --provenance reverification --evidence-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-3.14-sdist" --out evidence/python-3.14-sdist.json || status=$?
          exit "$status"

      - name: Retain the credential-free re-verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-pypi-0.1.0-reverification
          path: evidence/
          retention-days: 90
          if-no-files-found: error

      - name: Assert the retained evidence is complete
        if: ${{ !cancelled() }}
        run: python scripts/check-retained-evidence.py --provenance reverification --evidence-dir evidence
